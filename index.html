<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Результативність</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    /* легкий сірий градієнт */
    background: linear-gradient(135deg, #e5e7eb, #f3f4f6, #e5e7eb);
    color:#111827;
}

/* картка “на передньому плані” */
.card{
    width:100%;
    max-width:520px;

    background:#ffffff;
    border-radius:18px;

    padding:26px;

    /* обводка + глибина */
    border:1px solid #d1d5db;
    box-shadow:
        0 10px 30px rgba(0,0,0,0.12),
        0 1px 0 rgba(255,255,255,0.6) inset;

    position:relative;
}

/* тонка синя акцентна рамка */
.card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:18px;
    padding:1px;

    background: linear-gradient(135deg, #2563eb, transparent);

    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;

    pointer-events:none;
}

h1{
    font-size:20px;
    text-align:center;
    margin-bottom:18px;
}

.grid{
    display:grid;
    gap:12px;
}

.row{
    display:flex;
    flex-direction:column;
}

label{
    font-size:13px;
    color:#6b7280;
    margin-bottom:4px;
}

input{
    padding:11px 12px;
    border:1px solid #e5e7eb;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:0.2s;
    background:#fafafa;
}

input:focus{
    border-color:#2563eb;
    background:white;
    box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}

.result{
    margin-top:18px;
    text-align:center;
    padding:18px;
    border-top:1px solid #e5e7eb;
}

.big{
    font-size:44px;
    font-weight:700;
    color:#111827;
}

.small{
    font-size:14px;
    color:#6b7280;
    margin-top:6px;
}
</style>
</head>

<body>

<div class="card">
    <h1>📦 Результативність</h1>

    <div class="grid">

        <div class="row">
            <label>ДС</label>
            <input type="number" id="ds" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>ТЗ</label>
            <input type="number" id="tz" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>Пакування (редагується)</label>
            <input type="number" id="pack" value="0" oninput="packEdited = true; calc()">
        </div>

        <div class="row">
            <label>Переміщення</label>
            <input type="number" id="move" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>Розміщення</label>
            <input type="number" id="place" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>Години</label>
            <input type="number" step="0.1" id="hours" value="1" oninput="calc()">
        </div>

    </div>

    <div class="result">
        <div class="big" id="result">0.00</div>
        <div class="small">балів / год</div>
    </div>
</div>

<script>
let packEdited = false;

function calc(){

    const ds = Number(document.getElementById("ds").value) || 0;
    const tz = Number(document.getElementById("tz").value) || 0;

    if(!packEdited){
        document.getElementById("pack").value = ds + tz;
    }

    const pack = Number(document.getElementById("pack").value) || 0;
    const move = Number(document.getElementById("move").value) || 0;
    const place = Number(document.getElementById("place").value) || 0;
    const hours = Number(document.getElementById("hours").value) || 1;

    const total =
        ds * 1 +
        tz * 3.3 +
        pack * 0.4 +
        move * 3.3 +
        place * 0.3;

    const res = total / hours;

    document.getElementById("result").innerText = res.toFixed(2);
}

calc();
</script>

</body>
</html>
