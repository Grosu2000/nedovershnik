<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Результативність</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    /* темно-сірий фон */
    background: linear-gradient(135deg, #1f2937, #111827);
    color:#e5e7eb;
}

.card{
    width:100%;
    max-width:520px;

    background:#1f2937;
    border-radius:18px;
    padding:26px;

    border:1px solid #374151;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.05);
}

h1{
    font-size:20px;
    text-align:center;
    margin-bottom:18px;
    color:#f3f4f6;
}

.grid{
    display:grid;
    gap:12px;
}

.row{
    display:flex;
    flex-direction:column;
}

label{
    font-size:13px;
    color:#9ca3af;
    margin-bottom:4px;
}

input{
    padding:11px 12px;
    border-radius:10px;
    font-size:15px;

    background:#111827;
    color:#e5e7eb;

    border:1px solid #374151;

    outline:none;
    transition:0.2s;
}

input:focus{
    border-color:#60a5fa;
    box-shadow:0 0 0 3px rgba(96,165,250,0.15);
}

.result{
    margin-top:18px;
    text-align:center;
    padding:18px;
    border-top:1px solid #374151;
}

.big{
    font-size:44px;
    font-weight:700;
    color:#60a5fa;
}

.small{
    font-size:14px;
    color:#9ca3af;
    margin-top:6px;
}
</style>
</head>

<body>

<div class="card">
    <h1>📦 Результативність</h1>

    <div class="grid">

        <div class="row">
            <label>ДС</label>
            <input type="number" id="ds" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>ТЗ</label>
            <input type="number" id="tz" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>Пакування (редагується)</label>
            <input type="number" id="pack" value="0" oninput="packEdited = true; calc()">
        </div>

        <div class="row">
            <label>Переміщення</label>
            <input type="number" id="move" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>Розміщення</label>
            <input type="number" id="place" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>Години</label>
            <input type="number" step="0.1" id="hours" value="1" oninput="calc()">
        </div>

    </div>

    <div class="result">
        <div class="big" id="result">0.00</div>
        <div class="small">балів / год</div>
    </div>
</div>

<script>
let packEdited = false;

function calc(){

    const ds = Number(document.getElementById("ds").value) || 0;
    const tz = Number(document.getElementById("tz").value) || 0;

    if(!packEdited){
        document.getElementById("pack").value = ds + tz;
    }

    const pack = Number(document.getElementById("pack").value) || 0;
    const move = Number(document.getElementById("move").value) || 0;
    const place = Number(document.getElementById("place").value) || 0;
    const hours = Number(document.getElementById("hours").value) || 1;

    const total =
        ds * 1 +
        tz * 3.3 +
        pack * 0.4 +
        move * 3.3 +
        place * 0.3;

    const res = total / hours;

    document.getElementById("result").innerText = res.toFixed(2);
}

calc();
</script>

</body>
</html>
