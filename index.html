<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Результативність</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:#111827;
}

.card{
    width:100%;
    max-width:520px;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:24px;
}

h1{
    font-size:20px;
    margin-bottom:16px;
    text-align:center;
}

.grid{
    display:grid;
    gap:12px;
}

.row{
    display:flex;
    flex-direction:column;
}

label{
    font-size:13px;
    color:#6b7280;
    margin-bottom:4px;
}

input{
    padding:10px 12px;
    border:1px solid #e5e7eb;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

.result{
    margin-top:18px;
    text-align:center;
    padding:16px;
    border-top:1px solid #e5e7eb;
}

.big{
    font-size:40px;
    font-weight:700;
}

.small{
    font-size:14px;
    color:#6b7280;
    margin-top:6px;
}
</style>
</head>

<body>

<div class="card">
    <h1>📦 Результативність</h1>

    <div class="grid">

        <div class="row">
            <label>ДС</label>
            <input type="number" id="ds" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>ТЗ</label>
            <input type="number" id="tz" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>Пакування (можна редагувати)</label>
            <input type="number" id="pack" value="0" oninput="packEdited = true; calc()">
        </div>

        <div class="row">
            <label>Переміщення</label>
            <input type="number" id="move" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>Розміщення</label>
            <input type="number" id="place" value="0" oninput="calc()">
        </div>

        <div class="row">
            <label>Години</label>
            <input type="number" step="0.1" id="hours" value="1" oninput="calc()">
        </div>

    </div>

    <div class="result">
        <div class="big" id="result">0.00</div>
        <div class="small">балів / год</div>
    </div>
</div>

<script>

let packEdited = false;

function calc(){

    const ds = Number(document.getElementById("ds").value) || 0;
    const tz = Number(document.getElementById("tz").value) || 0;

    // якщо користувач НЕ редагував — рахуємо автоматично
    if(!packEdited){
        document.getElementById("pack").value = ds + tz;
    }

    const pack = Number(document.getElementById("pack").value) || 0;
    const move = Number(document.getElementById("move").value) || 0;
    const place = Number(document.getElementById("place").value) || 0;
    const hours = Number(document.getElementById("hours").value) || 1;

    const total =
        ds * 1 +
        tz * 3.3 +
        pack * 0.4 +
        move * 3.3 +
        place * 0.3;

    const res = total / hours;

    document.getElementById("result").innerText = res.toFixed(2);
}

calc();
</script>

</body>
</html>
