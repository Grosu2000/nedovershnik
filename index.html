<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор результативності</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    color:white;
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    margin-bottom:20px;
    font-size:28px;
}

.grid{
    display:grid;
    gap:15px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:6px;
    font-size:14px;
    color:#cbd5e1;
}

input{
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1e293b;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    box-shadow:0 0 0 2px #3b82f6;
}

button{
    margin-top:20px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#1d4ed8;
}

.result{
    margin-top:25px;
    text-align:center;
    display:none;
}

.score{
    font-size:42px;
    font-weight:bold;
    color:#60a5fa;
}

.points{
    margin-top:10px;
    color:#cbd5e1;
    font-size:18px;
}
</style>
</head>
<body>

<div class="card">
    <h1>📦 Результативність</h1>

    <div class="grid">

        <div class="input-group">
            <label>Збирання в ДС</label>
            <input type="number" id="ds" value="0">
        </div>

        <div class="input-group">
            <label>Збирання в ТЗ</label>
            <input type="number" id="tz" value="0">
        </div>

        <div class="input-group">
            <label>Пакування</label>
            <input type="number" id="pack">
        </div>

        <div class="input-group">
            <label>Переміщення</label>
            <input type="number" id="move">
        </div>

        <div class="input-group">
            <label>Розміщення</label>
            <input type="number" id="place">
        </div>

        <div class="input-group">
            <label>Години під сканом</label>
            <input type="number" step="0.1" id="hours">
        </div>

    </div>

    <button onclick="calculate()">
        Розрахувати
    </button>

    <div class="result" id="result">
        <div class="score" id="score">0</div>
        <div class="points" id="points">0 балів</div>
    </div>
</div>

<script>
function calculate() {

    const ds = Number(document.getElementById("ds").value) || 0;
    const tz = Number(document.getElementById("tz").value) || 0;
    const pack = Number(document.getElementById("pack").value) || 0;
    const move = Number(document.getElementById("move").value) || 0;
    const place = Number(document.getElementById("place").value) || 0;
    const hours = Number(document.getElementById("hours").value) || 0;

    if(hours <= 0){
        alert("Вкажіть кількість годин.");
        return;
    }

    const totalPoints =
        ds * 1 +
        tz * 3.3 +
        pack * 0.4 +
        move * 3.3 +
        place * 0.3;

    const productivity = totalPoints / hours;

    document.getElementById("score").innerText =
        productivity.toFixed(2);

    document.getElementById("points").innerText =
        `Загалом балів: ${totalPoints.toFixed(1)}`;

    document.getElementById("result").style.display = "block";
}
</script>

</body>
</html>
